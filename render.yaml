services:
  - type: web
    name: ar-industrial-safety-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        value: http://localhost:5173
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: ar-industrial-safety-api
          envVarKey: RENDER_EXTERNAL_URL
